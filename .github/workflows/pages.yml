name: Publish iPhone app (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          pip install --quiet pillow
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          base64 -d icon.b64 > _site/icon-src.png
          python3 -c "
          from PIL import Image
          im = Image.open('_site/icon-src.png').convert('RGB')
          for name, s in [('icon-192.png',192), ('icon-512.png',512), ('apple-touch-icon.png',180)]:
              im.resize((s, s), Image.LANCZOS).save('_site/' + name, optimize=True)
          "
          rm _site/icon-src.png
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
