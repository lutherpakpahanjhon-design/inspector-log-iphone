<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Inspector Log — DAMAC Digital JKT02</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspector Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B3B5B">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#0B3B5B;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#F3F6F9}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;background:#0B3B5B;transition:opacity .4s}
  #splash img{width:84px;height:84px;border-radius:18px}
  #splash b{font-size:20px}#splash span{opacity:.75;font-size:13px}
  .sp{width:28px;height:28px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
  #hint{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:#fff;color:#16324A;border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:14px;line-height:1.4;display:none;z-index:9}
  #hint button{float:right;border:0;background:none;font-size:18px;color:#8A97A5;margin:-4px -4px 0 6px}
  #err{display:none;color:#fff;text-align:center;padding:0 24px;font-size:14px}#err a{color:#9fd3ff}
</style>
</head>
<body>
<iframe id="app" title="Inspector Log" allow="camera; clipboard-write; fullscreen" src="about:blank"></iframe>
<div id="splash"><img src="icon-192.png" alt=""><b>Inspector Log</b><span>DAMAC Digital JKT02 — HSE</span><div class="sp"></div>
  <div id="err">Aplikasi belum termuat. Periksa koneksi internet, lalu <a href="#" onclick="location.reload();return false">coba lagi</a>.</div></div>
<div id="hint"><button aria-label="Tutup" onclick="this.parentNode.style.display='none';try{localStorage.setItem('hintOff','1')}catch(e){}">✕</button>
  <b>Pasang di iPhone:</b> ketuk tombol <b>Bagikan</b> <span style="font-size:16px">⬆︎</span> di Safari, lalu pilih <b>“Tambah ke Layar Utama”</b>.</div>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzAGhJEOSnUk-sJPnuMLbQTwh6aog-AsZ11pPsAAQ4mDcS7QHB3dFR0-0YtvxHgWxEhDQ/exec';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  f.addEventListener('load', function () { if (f.src.indexOf('script.google.com') < 0) return; setTimeout(function () { sp.style.opacity = '0'; setTimeout(function () { sp.style.display = 'none'; }, 400); }, 600); });
  f.src = APP_URL;
  setTimeout(function () { if (sp.style.display !== 'none') document.getElementById('err').style.display = 'block'; }, 25000);
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  var off = false; try { off = localStorage.getItem('hintOff') === '1'; } catch (e) {}
  if (ios && !standalone && !off) document.getElementById('hint').style.display = 'block';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
